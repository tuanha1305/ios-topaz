name: iosroot

# The iOS root for userdata (README step 2) on a Linux runner: tools/mkiosroot.sh +
# tools/sweet-root-tweaks.py, then a sparse image split into pieces that fastboot flashes
# one after another (what `fastboot -S` does). Each piece is its own artifact, AES-256-CTR
# encrypted with the repository secret ROOT_KEY (64 hex digits; IV = piece number): the
# artifacts of a public repository can be downloaded by anyone, and this is Apple's OS.
# A PC with little free space fetches, decrypts and flashes one piece at a time.

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: iPhone X (iPhone10,3) iOS 16.7.16 20H392 IPSW
        default: https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw
      size:
        description: HFS+ volume size
        default: 16G
      piece_mb:
        description: sparse piece size (MiB)
        default: "1024"

jobs:
  root:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      W: /mnt/w
      ROOT_KEY: ${{ secrets.ROOT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Disk space
        run: |
          [[ ${#ROOT_KEY} == 64 ]] || { echo "set the ROOT_KEY secret (64 hex digits)"; exit 1; }
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo mkdir -p "$W" && sudo chown "$USER" "$W"
          df -h / /mnt

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y hfsprogs android-sdk-libsparse-utils fuse3 libfuse3-dev \
            libbz2-dev zlib1g-dev libattr1-dev cmake g++ rsync
          git clone --recursive https://github.com/sgan81/apfs-fuse "$W/apfs-fuse"
          cmake -S "$W/apfs-fuse" -B "$W/apfs-fuse/build" -DUSE_FUSE3=ON
          make -C "$W/apfs-fuse/build" -j"$(nproc)" apfs-fuse
          sudo install "$W/apfs-fuse/build/apfs-fuse" /usr/local/bin/
          (cd "$W" && npm install --no-save @actions/artifact@2)

      - name: IPSW disk images
        run: |
          mkdir -p "$W/ipsw"
          python3 tools/remotezip.py "${{ inputs.ipsw_url }}" BuildManifest.plist "$W/ipsw"
          python3 - "$W/ipsw/BuildManifest.plist" > "$W/dmgs" <<'EOF'
          import plistlib, sys
          m = plistlib.load(open(sys.argv[1], 'rb'))
          i = next(i for i in m['BuildIdentities']
                   if i['Info']['DeviceClass'] == 'd22ap' and i['Info']['RestoreBehavior'] == 'Erase')
          for k in ('OS', 'Cryptex1,SystemOS', 'Cryptex1,AppOS'):
              print(i['Manifest'][k]['Info']['Path'])
          EOF
          cat "$W/dmgs"
          while read -r d; do python3 tools/remotezip.py "${{ inputs.ipsw_url }}" "$d" "$W/ipsw" | tail -1; done < "$W/dmgs"
          ls -l "$W/ipsw"

      - name: Root image
        run: |
          mapfile -t d < "$W/dmgs"
          sudo bash tools/mkiosroot.sh "$W/ipsw/${d[0]}" "$W/ipsw/${d[1]}" "$W/ipsw/${d[2]}" "$W/root.img" "${{ inputs.size }}"
          rm -rf "$W/ipsw"
          mkdir "$W/m"
          sudo mount -t hfsplus -o loop,force "$W/root.img" "$W/m"
          sudo python3 tools/sweet-root-tweaks.py "$W/m"
          df -h "$W/m"
          sudo umount "$W/m"
          sudo chown "$USER" "$W/root.img"

      - name: Sparse pieces
        run: |
          img2simg "$W/root.img" "$W/root.simg"
          rm "$W/root.img"
          mkdir "$W/out"
          simg2simg "$W/root.simg" "$W/out/piece" $(( ${{ inputs.piece_mb }} * 1024 * 1024 ))
          rm "$W/root.simg"
          cd "$W/out"
          for p in $(ls piece.* | sort -t. -k2 -n); do
            i=${p#piece.}
            sha=$(sha256sum "$p" | cut -d' ' -f1)
            openssl enc -aes-256-ctr -K "$ROOT_KEY" -iv "$(printf '%032x' "$i")" -in "$p" -out "root-$i.enc"
            rm "$p"
            echo "$i $sha" >> pieces.txt
          done
          cat pieces.txt
          ls -l

      - name: Upload pieces
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {DefaultArtifactClient} = require(`${process.env.W}/node_modules/@actions/artifact`);
            const client = new DefaultArtifactClient();
            const dir = `${process.env.W}/out`;
            const opts = {retentionDays: 3, compressionLevel: 0};
            for (const f of fs.readdirSync(dir).sort()) {
              const name = f === 'pieces.txt' ? 'root-pieces' : f.replace(/\.enc$/, '');
              await client.uploadArtifact(name, [`${dir}/${f}`], dir, opts);
              core.info(`uploaded ${name}`);
            }
